name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, OpenAPI & production rendering
    runs-on: ubuntu-latest
    env:
      NUXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Cache Nuxt build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .nuxt
            node_modules/.cache
          key: nuxt-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock', 'nuxt.config.ts') }}
          restore-keys: |
            nuxt-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test onboarding
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Validate OpenAPI
        run: bun run openapi:check

      - name: Build production image
        run: docker build --tag topiqu-landing:ci .

      - name: Start production image
        id: production_server
        run: docker run --detach --name topiqu-landing-ci --publish 127.0.0.1:3000:3000 topiqu-landing:ci

      - name: Check production rendering
        run: bun run test:production

      - name: Production logs
        if: failure() && steps.production_server.outcome == 'success'
        run: docker logs topiqu-landing-ci

      - name: Stop production image
        if: always() && steps.production_server.outcome == 'success'
        run: docker rm --force topiqu-landing-ci
